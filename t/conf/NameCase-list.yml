---
# Hand-written schema for Lingua::EN::NameCase::NameCase.
#
# extract-schemas describes only the one-argument arrayref call,
# NameCase([...]), because one documented parameter maps to one argument.
# NameCase also accepts a plain list in list context -- NameCase('A', 'B') --
# which is a different call shape and returns a list.  Two positional string
# parameters make the harness's normal cases call NameCase(@alist); output
# type 'array' makes it capture the result in list context, which is what the
# list form needs.  The arrayref form stays covered by the extracted schema.
#
# Absent boolean config keys default to on, so only the tests that must be
# off are listed here.
module: Lingua::EN::NameCase
function: NameCase
config:
  test_non_ascii: 0
  test_nuls: 0
  test_security: 0
  test_undef: 0
input:
  first:
    type: string
    position: 0
    optional: 0
  second:
    type: string
    position: 1
    optional: 0
output:
  type: array
